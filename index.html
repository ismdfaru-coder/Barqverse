<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoBrowser Scraper - Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header .info {
            font-size: 13px;
            opacity: 0.9;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .login-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 12px;
        }

        .login-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 13px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .sign-in-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .sign-in-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .sign-in-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .user .message-avatar {
            background: #667eea;
            color: white;
        }

        .assistant .message-avatar {
            background: #764ba2;
            color: white;
        }

        .message-content {
            max-width: 60%;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }

        .user .message-content {
            background: #667eea;
            color: white;
        }

        .assistant .message-content {
            background: #f0f0f0;
            color: #333;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            display: block;
        }

        .loading {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-selector label {
            font-size: 13px;
            font-weight: 500;
            color: #333;
            min-width: 60px;
        }

        .model-selector select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            background: white;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper textarea {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }

        .input-wrapper textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .demo-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .demo-notice strong {
            color: #ff6b6b;
        }

        @media (max-width: 600px) {
            .message-content {
                max-width: 85%;
            }

            .header h1 {
                font-size: 16px;
            }

            .login-box h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-screen" style="display: flex;">
            <div class="login-box">
                <h2>🤖 AutoBrowser Scraper</h2>
                <p>Connect your email to get responses from AutoBrowser</p>
                <div class="form-group">
                    <label for="emailInput">Email Address:</label>
                    <input 
                        type="email" 
                        id="emailInput" 
                        placeholder="user@gmail.com"
                    >
                </div>
                <button class="sign-in-btn" id="signInBtn" onclick="handleSignIn()">
                    Sign In
                </button>
                <p style="margin-top: 20px; color: #999; font-size: 12px;">
                    ✅ Your email is never stored. A random demo address is pre-filled for you.
                </p>
            </div>
        </div>

        <!-- Chat Screen (Hidden Initially) -->
        <div id="chatScreen" style="display: none; flex: 1; display: flex; flex-direction: column;">
            <!-- Header -->
            <div class="header">
                <div>
                    <h1>← AutoBrowser Scraper Chat</h1>
                    <div class="info" id="userEmail"></div>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>

            <!-- Messages Area -->
            <div class="chat-area">
                <div class="demo-notice">
                    <strong>⚠️ Demo Mode:</strong> Backend not connected. Click "Send" to see demo responses.
                </div>
                <div class="messages" id="messagesContainer"></div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="model-selector">
                    <label>Model:</label>
                    <select id="modelSelect">
                        <option value="Auto">Auto</option>
                        <option value="Sonnet 5">Sonnet 5</option>
                        <option value="Fable 5">Fable 5</option>
                        <option value="GPT-5.6 Terra">GPT-5.6 Terra</option>
                        <option value="Gemini 3.1 Pro">Gemini 3.1 Pro</option>
                    </select>
                </div>
                <div class="input-wrapper">
                    <textarea 
                        id="promptInput" 
                        placeholder="Type your prompt here..."
                        rows="2"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="handleSendPrompt()">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Demo responses
        const demoResponses = {
            "what is ai": "AI (Artificial Intelligence) is a technology that enables computers to perform tasks that typically require human intelligence. This includes understanding language, recognizing images, making decisions, and solving problems. Machine learning is the main subset behind modern AI, where algorithms learn from data to improve performance.",
            "what is machine learning": "Machine learning is a subset of artificial intelligence that focuses on enabling computers to learn from data without being explicitly programmed. Instead of following predetermined instructions, machine learning algorithms analyze patterns in data and improve their performance through experience.",
            "hello": "Hello! 👋 I'm here to help you get responses from AutoBrowser. Try asking me something like 'What is AI?' or 'Explain quantum computing'.",
            "default": "That's an interesting question! In a production environment, this would be sent to AutoBrowser, the AI would process it, and I'd return the response. For now, this is a demo mode to show you how the interface works."
        };

        // Global state
        let isLoggedIn = false;
        let userEmail = '';
        let isLoading = false;
        let messages = [];

        const RANDOM_NAMES = ['david', 'john', 'sarah', 'mike', 'emma', 'alex', 'chris', 'olivia', 'james', 'sophia', 'liam', 'ava'];

        function generateRandomEmail() {
            const name = RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)];
            return `${name}@gmail.com`;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('emailInput').value = generateRandomEmail();
            addWelcomeMessage();
        });

        function addWelcomeMessage() {
            addMessage(
                '🤖',
                'Welcome to AutoBrowser Scraper! 👋\n\nType a prompt and I\'ll fetch the response from AutoBrowser for you. Try asking "What is AI?" or any other question!',
                'assistant'
            );
        }

        function handleSignIn() {
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('signInBtn');

            if (!email) {
                alert('Please enter an email address');
                return;
            }

            if (!email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }

            btn.disabled = true;
            btn.textContent = '🔄 Signing in...';

            // Simulate sign-in delay
            setTimeout(() => {
                isLoggedIn = true;
                userEmail = email;

                // Show chat screen
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('chatScreen').style.display = 'flex';
                document.getElementById('userEmail').textContent = `Logged in as: ${email}`;

                // Clear and reset
                btn.disabled = false;
                btn.textContent = 'Sign In';

                addWelcomeMessage();
            }, 800);
        }

        function handleLogout() {
            isLoggedIn = false;
            userEmail = '';
            messages = [];
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('emailInput').value = generateRandomEmail();
            document.getElementById('promptInput').value = '';
            document.getElementById('messagesContainer').innerHTML = '';
        }

        async function handleSendPrompt() {
            const prompt = document.getElementById('promptInput').value.trim();
            const model = document.getElementById('modelSelect').value;
            const btn = document.getElementById('sendBtn');

            if (!prompt) {
                alert('Please enter a prompt');
                return;
            }

            if (isLoading) return;

            isLoading = true;
            btn.disabled = true;

            // Add user message
            addMessage('👤', prompt, 'user');
            document.getElementById('promptInput').value = '';

            // Add loading message
            const loadingId = Date.now();
            addLoadingMessage(loadingId);

            // Simulate API call with delay
            setTimeout(() => {
                // Get demo response
                const promptLower = prompt.toLowerCase();
                let response = demoResponses.default;

                for (const [key, value] of Object.entries(demoResponses)) {
                    if (key !== 'default' && promptLower.includes(key)) {
                        response = value;
                        break;
                    }
                }

                // Remove loading message and add response
                removeLoadingMessage(loadingId);
                addMessage('🤖', response, 'assistant', Math.floor(Math.random() * 2000) + 3000);

                isLoading = false;
                btn.disabled = false;
            }, 1500);
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                handleSendPrompt();
            }
        }

        function addMessage(avatar, content, type, duration = null) {
            const message = {
                id: Date.now(),
                avatar,
                content,
                type,
                duration
            };
            messages.push(message);
            renderMessages();
        }

        function addLoadingMessage(id) {
            const loadingMsg = {
                id,
                type: 'loading',
                isLoading: true
            };
            messages.push(loadingMsg);
            renderMessages();
        }

        function removeLoadingMessage(id) {
            messages = messages.filter(m => m.id !== id);
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = messages.map(msg => {
                if (msg.isLoading) {
                    return `
                        <div class="message assistant">
                            <div class="message-avatar">🤖</div>
                            <div class="message-content">
                                <div class="loading">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="message ${msg.type}">
                        <div class="message-avatar">${msg.avatar}</div>
                        <div style="flex: 1;">
                            <div class="message-content">${escapeHtml(msg.content)}</div>
                            ${msg.duration ? `<span class="message-time">⏱️ ${msg.duration}ms</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            // Scroll to bottom
            container.parentElement.scrollTop = container.parentElement.scrollHeight;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
