# Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: barqverse-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
